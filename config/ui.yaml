# CheIME Windows 11 style candidate-window preset.
# Colors use CSS-style #RRGGBB (red, green, blue), never Weasel's #BBGGRR.

style:
  color_scheme: windows_11_light
  color_scheme_dark: windows_11_dark
  font_face: "Microsoft YaHei UI"
  label_font_face: "Microsoft YaHei UI"
  comment_font_face: "Microsoft YaHei UI"
  font_point: 16
  label_font_point: 12
  comment_font_point: 12
  page_size: 5
  show_labels: true
  label_format: "%s"
  inline_preedit: true
  preedit_type: composition
  preedit_underline_style: dash
  preedit_underline_bold: false
  preedit_background_enabled: false
  antialias_mode: cleartype
  mark_text: ""
  hover_type: semi_hilite
  paging_on_scroll: true
  candidate_abbreviate_length: 0

  layout:
    type: horizontal
    text_vertical_align: center
    min_width: 320
    max_width: 720
    margin_x: 6
    margin_y: 6
    spacing: 4
    candidate_spacing: 4
    hilite_spacing: 6
    hilite_padding_x: 10
    hilite_padding_y: 6
    corner_radius: 8
    hilited_corner_radius: 5
    border_width: 1
    hilited_border_width: 1
    mark_width: 3
    mark_height: 18
    mark_gap: 6
    shadow_radius: 0
    shadow_offset_x: 0
    shadow_offset_y: 4
    caret_offset_x: 0
    caret_offset_y: 8
    screen_edge_margin: 12

preset_color_schemes:
  windows_11_light:
    name: "Windows 11 Light"
    back_color: "#FFFFFF"
    border_color: "#D1D1D1"
    text_color: "#1A1A1A"
    candidate_text_color: "#1A1A1A"
    comment_text_color: "#616161"
    label_color: "#616161"
    hilited_candidate_text_color: "#1A1A1A"
    hilited_candidate_back_color: "#F2F2F2"
    hilited_candidate_border_color: "#C8C8C8"
    hilited_mark_color: "#0067C0"
    shadow_color: "#000000"
    preedit_text_color: "#1A1A1A"
    preedit_back_color: "#FFFFFF"
    preedit_underline_color: "#0067C0"

  windows_11_dark:
    name: "Windows 11 Dark"
    back_color: "#2B2B2B"
    border_color: "#4A4A4A"
    text_color: "#FFFFFF"
    candidate_text_color: "#FFFFFF"
    comment_text_color: "#B8B8B8"
    label_color: "#B8B8B8"
    hilited_candidate_text_color: "#FFFFFF"
    hilited_candidate_back_color: "#3A3A3A"
    hilited_candidate_border_color: "#666666"
    hilited_mark_color: "#60CDFF"
    shadow_color: "#000000"
    preedit_text_color: "#FFFFFF"
    preedit_back_color: "#2B2B2B"
    preedit_underline_color: "#60CDFF"
