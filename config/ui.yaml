# CheIME candidate-window appearance.
# All colors are CSS-style #RRGGBB (red, green, blue), never Weasel's BGR.

style:
  color_scheme: cheime_light
  color_scheme_dark: cheime_dark
  font_face: "Microsoft YaHei UI"
  label_font_face: "Microsoft YaHei UI"
  comment_font_face: "Microsoft YaHei UI"
  font_point: 18
  label_font_point: 13
  comment_font_point: 13
  page_size: 5
  show_labels: true
  label_format: "%s"
  inline_preedit: false
  preedit_type: composition
  antialias_mode: cleartype
  mark_text: ""
  hover_type: none
  paging_on_scroll: true
  candidate_abbreviate_length: 0

  layout:
    type: vertical
    min_width: 280
    max_width: 0
    margin_x: 10
    margin_y: 8
    spacing: 6
    candidate_spacing: 4
    hilite_spacing: 8
    hilite_padding_x: 10
    hilite_padding_y: 5
    corner_radius: 10
    hilited_corner_radius: 7
    border_width: 1
    shadow_radius: 0
    shadow_offset_x: 0
    shadow_offset_y: 8
    caret_offset_x: 0
    caret_offset_y: 8

preset_color_schemes:
  cheime_light:
    name: "澈 · 明"
    back_color: "#FFFFFF"
    border_color: "#E1E4E8"
    text_color: "#1F2328"
    candidate_text_color: "#1F2328"
    comment_text_color: "#6E7781"
    label_color: "#8C959F"
    hilited_candidate_text_color: "#FFFFFF"
    hilited_candidate_back_color: "#316DCA"
    hilited_mark_color: "#316DCA"
    shadow_color: "#8C959F"

  cheime_dark:
    name: "澈 · 暗"
    back_color: "#202124"
    border_color: "#34363A"
    text_color: "#E8EAED"
    candidate_text_color: "#E8EAED"
    comment_text_color: "#9AA0A6"
    label_color: "#9AA0A6"
    hilited_candidate_text_color: "#FFFFFF"
    hilited_candidate_back_color: "#3F6AE0"
    hilited_mark_color: "#8AB4F8"
    shadow_color: "#111318"
