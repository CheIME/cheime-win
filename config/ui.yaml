# CheIME Windows 11 style candidate-window preset.
# Colors use CSS-style #RRGGBB (red, green, blue), never Weasel's #BBGGRR.

style:
  color_scheme: windows_11_light
  color_scheme_dark: windows_11_dark
  font_face: "Microsoft YaHei UI"
  label_font_face: "Microsoft YaHei UI"
  comment_font_face: "Microsoft YaHei UI"
  font_point: 16
  label_font_point: 12
  comment_font_point: 12
  font_weight: 400
  label_font_weight: 400
  comment_font_weight: 400
  page_size: 5
  show_labels: true
  show_candidate_annotations: true
  label_format: "%s"
  inline_preedit: false
  preedit_type: composition
  antialias_mode: cleartype

  layout:
    type: horizontal
    text_vertical_align: center
    text_horizontal_align: left
    min_width: 320
    margin_x: 6
    margin_y: 6
    margin_left: 6
    margin_right: 6
    margin_top: 6
    margin_bottom: 6
    spacing: 4
    candidate_spacing: 4
    hilite_spacing: 6
    label_spacing: 6
    comment_spacing: 6
    hilite_padding_x: 10
    hilite_padding_y: 6
    hilite_padding_left: 10
    hilite_padding_right: 10
    hilite_padding_top: 6
    hilite_padding_bottom: 6
    candidate_min_height: 0
    corner_radius: 8
    hilited_corner_radius: 5
    border_width: 1
    hilited_border_width: 1
    mark_width: 3
    mark_height: 18
    mark_gap: 6
    mark_position: left
    mark_offset_x: 0
    mark_offset_y: 0
    mark_corner_radius: 1
    shadow_enabled: true
    shadow_radius: 12
    shadow_opacity: 28
    shadow_offset_y: 4
    caret_offset_y: 0
    screen_edge_margin: 12

preset_color_schemes:
  windows_11_light:
    back_color: "#FFFFFF"
    border_color: "#D1D1D1"
    text_color: "#1A1A1A"
    candidate_text_color: "#1A1A1A"
    comment_text_color: "#616161"
    label_color: "#616161"
    hilited_candidate_text_color: "#1A1A1A"
    hilited_candidate_back_color: "#F2F2F2"
    hilited_candidate_border_color: "#C8C8C8"
    hilited_mark_color: "#0067C0"
    shadow_color: "#000000"

  windows_11_dark:
    back_color: "#2B2B2B"
    border_color: "#4A4A4A"
    text_color: "#FFFFFF"
    candidate_text_color: "#FFFFFF"
    comment_text_color: "#B8B8B8"
    label_color: "#B8B8B8"
    hilited_candidate_text_color: "#FFFFFF"
    hilited_candidate_back_color: "#3A3A3A"
    hilited_candidate_border_color: "#666666"
    hilited_mark_color: "#60CDFF"
    shadow_color: "#000000"
