<body><header><div class="brand"><span class="mark">澈</span><div><b>CheIME UI Studio</b><small>WebView2 本地配置工具</small></div></div><div><button class="reset" onclick="reloadConfig()">撤销更改</button><button class="save" onclick="saveConfig()">保存到 CheIME</button></div></header>
<main><section class="preview"><span class="badge">实时预览 · #RRGGBB</span><div class="previewStack"><div class="inputDemo" id="inputDemo">示例输入：<span class="inlineText">ni'hao</span></div><div class="candidate" id="candidate"><div class="preedit">ni'hao</div><div class="rows" id="rows"></div></div></div><span class="hint">保存后立即通知候选窗口热更新</span></section>
